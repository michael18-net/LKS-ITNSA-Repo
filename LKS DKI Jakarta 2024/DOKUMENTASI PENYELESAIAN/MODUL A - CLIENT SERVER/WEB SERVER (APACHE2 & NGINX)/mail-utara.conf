<VirtualHost *:80>
	ServerName mail.utara.site
	Redirect permanent / https://mail.utara.site/
</VirtualHost>

<VirtualHost *:443>
	ServerName mail.utara.site
	DocumentRoot /var/lib/roundcube

	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/mail.utara.site.crt
	SSLCertificateKeyFile /etc/ssl/private/mail.utara.site.key
	SSLCACertificateFile /etc/ssl/certs/cacert.pem

	<Directory /var/lib/roundcube>
		Options +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
